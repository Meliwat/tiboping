name: Container

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/container.yml
      - Dockerfile
      - compose.yaml
      - package-lock.json
      - package.json
      - apps/**
      - packages/**
      - scripts/docker-smoke.mjs
      - scripts/copy-server-assets.mjs
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Runtime smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0

      - name: Build, deliver, and restart
        run: npm run test:docker

  multiarch:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            cache-scope: amd64
          - platform: linux/arm64
            cache-scope: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=tiboping-${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=tiboping-${{ matrix.cache-scope }}
